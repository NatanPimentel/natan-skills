name: Residindo capture

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install capture dependencies
        run: |
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
          python3 -m pip install --break-system-packages img2pdf Pillow

      - name: Capture site
        run: node _tmp/capture_residindo.mjs

      - name: Upload capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: residindo-capture
          path: residindo-capture/
          if-no-files-found: error
          compression-level: 6

      - name: Publish optimized WebP assets to branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add residindo-public-assets
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "chore: publish residindo webp assets"
          git push origin HEAD:${{ github.head_ref }}
